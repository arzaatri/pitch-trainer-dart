name: Build Android APK

on:
  workflow_dispatch: # manual trigger via the Actions tab's "Run workflow" button

permissions:
  contents: write # needed to publish the release this workflow creates

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
